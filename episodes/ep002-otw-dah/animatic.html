<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Otw Dah 2D</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1E1A2B;--yellow:#F5B544;--red:#E76F51;--blue:#263B55;--cream:#F4E9D8;--page:#F4E9D8;--fg:#1E1A2B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#14121B;--fg:#F4E9D8}}
:root[data-theme="dark"]{--page:#14121B;--fg:#F4E9D8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--page);color:var(--fg);font-family:"Baloo 2",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px;min-height:100vh}
#wrap{position:relative;width:min(100%,calc((100vh - 110px)*9/16));max-width:432px;aspect-ratio:9/16}
#stage{position:absolute;left:0;top:0;width:720px;height:1280px;transform-origin:0 0;overflow:hidden;border-radius:8px;background:#000}
body.render{padding:0;background:#000} body.render #wrap{width:720px;height:1280px;max-width:none} body.render #controls{display:none} body.render #stage{border-radius:0}
canvas{position:absolute;inset:0;width:720px!important;height:1280px!important}
.ov{position:absolute;display:none;z-index:5}
.pov{left:30px;right:30px;top:90px;text-align:center;font-weight:800;font-size:54px;line-height:1.05;color:#fff;-webkit-text-stroke:10px var(--ink);paint-order:stroke fill}
.pov b{color:var(--yellow)}
.cap{left:20px;right:20px;top:500px;text-align:center;font-weight:800;font-size:66px;line-height:1;color:#fff;-webkit-text-stroke:12px var(--ink);paint-order:stroke fill}
.cap.y{color:var(--yellow)}
.real{left:30px;top:140px;background:var(--red);color:#fff;font-weight:800;font-size:34px;padding:4px 18px;border:5px solid var(--ink);border-radius:14px;transform:rotate(-3deg)}
.real span{display:block;font-size:44px;line-height:1.05}
.clock{right:30px;top:250px;background:var(--ink);color:var(--yellow);font-weight:800;font-size:40px;padding:2px 18px;border-radius:14px;font-variant-numeric:tabular-nums}
.ban{left:24px;right:24px;top:340px;background:rgba(245,245,247,.97);border-radius:28px;padding:16px 20px;display:flex;gap:16px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.ban .ic{width:64px;height:64px;border-radius:16px;background:#2FBF5B;flex:none;display:flex;align-items:center;justify-content:center}
.ban .tx{font-family:system-ui,sans-serif;color:#111;font-size:26px;line-height:1.2}
.ban .tx b{display:block;font-size:24px}
.ban .tx small{color:#777;font-size:20px;float:right;font-weight:400}
.bub{background:#fff;color:var(--ink);border:5px solid var(--ink);border-radius:26px;padding:10px 20px;font-size:36px;font-weight:800;line-height:1.1;box-shadow:6px 6px 0 var(--ink);transform-origin:50% 100%}
.bub::after{content:"";position:absolute;width:26px;height:26px;background:#fff;border-right:5px solid var(--ink);border-bottom:5px solid var(--ink);bottom:-16px;left:var(--tx,60px);transform:rotate(45deg)}
.end{inset:0;background:var(--yellow);z-index:9}
.end .logo{position:absolute;left:0;right:0;top:420px;text-align:center;font-size:150px;font-weight:800;line-height:1;color:var(--red);-webkit-text-stroke:8px var(--ink);paint-order:stroke fill;text-shadow:8px 8px 0 var(--ink)}
.end .tag{position:absolute;left:0;right:0;top:780px;text-align:center;font-size:42px;font-weight:800;color:var(--blue)}
.end .cta{position:absolute;left:50%;top:880px;transform:translateX(-50%);white-space:nowrap;background:var(--blue);color:var(--cream);font-size:32px;font-weight:800;padding:12px 30px;border-radius:999px;border:5px solid var(--ink)}
#controls{display:flex;gap:10px;align-items:center;width:min(100%,432px)}
#controls button{font:inherit;font-weight:800;min-width:56px;min-height:44px;border-radius:12px;border:3px solid var(--fg);background:transparent;color:var(--fg)}
#controls input{flex:1;accent-color:#E76F51}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><svg id="v" viewBox="0 0 720 1280" width="720" height="1280" style="position:absolute;inset:0"></svg>
  <div class="ov pov" id="pov">POV: Kawan kau kata <b>"otw dah"</b></div>
  <div class="ov cap" id="cap"></div>
  <div class="ov clock" id="clock"></div>
  <div class="ov real" id="real">REALITI:<span id="realtx"></span></div>
  <div class="ov ban" id="ban"><div class="ic"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M21 12a9 9 0 0 1-13.5 7.8L3 21l1.2-4.5A9 9 0 1 1 21 12z"/></svg></div><div class="tx"><b>Kavi <small>sekarang</small></b><span id="bantx"></span></div></div>
  <div class="ov bub" id="bub"></div>
  <div class="ov end" id="end"><div class="logo">KALAU<br>LAH!</div><div class="tag">Malaysian everyday life, animated.</div><div class="cta">Tag kawan "otw" kau</div></div>
</div></div>
<audio id="snd" src="soundtrack.m4a" preload="auto"></audio>
<div id="controls"><button id="play">▶</button><button id="rew">↺</button><input id="seek" type="range" min="0" max="37" step="0.01" value="0"></div>

<script src="scene2d.js"></script>
</body>
</html>
