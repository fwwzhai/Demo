    amir.visible=glass.visible=true; amir.position.set(0,0,.95); amir.rotation.y=Math.PI;
    amir.rotation.y=0; amir.position.set(0,0,.95); amir.rotation.y=Math.PI; // faces table (-z)
    amir.rotation.y = Math.PI*1.0;
    ice.forEach((c,i)=>{ c.visible=melt>.05; c.scale.setScalar(.4+.6*melt); });
    tea.material.color.set(melt>.5?'#C7864A': melt>.1?'#D29A64':'#DDB487'); tea.scale.y=.75+.25*melt;
  }
  // camera + poses
  if(sc==='hook'||(sc==='m4'&&t<21.6)){
    const k = sc==='hook'? t/2.6 : (t-21)/0.6;
    camAt(lerp(1.4,1.1,k), 2.1, lerp(-3.9,-3.3,k), -.1,1.45,.9);
    pose(amir,{sit:1,lL:-1.5,lR:-1.5,eyes:'half',frown:1,brow:'sad',hx:.15,aLx:-1.1,aRx:-1.1,aRz:.3,aLz:-.3});
    web.visible=true; web.position.set(-.55,1.95,.65); web.lookAt(cam.position);
  }
  if(sc==='m1'){ camAt(1.5,2.2,-4.2, 0,1.35,.9);
    const up = t>3.6; phone.visible=true;
    pose(amir,{sit:1,lL:-1.5,lR:-1.5,eyes:blink(0)?'':'n',open:t>3.4&&t<4?.8:0,aRx:up?-2.6:-1.1,aRz:up?.2:.2,aLx:-1.4});
    const a=amir.userData.armL; phone.position.set(.32,1.42,.42); phone.rotation.set(-.4,Math.PI,0);
  }
  if(sc==='m2'){ camAt(1.9,2.3,-4.6,.4,1.35,1.2); phone.visible=true; phone.position.set(.32,1.42,.42); phone.rotation.set(-.4,Math.PI,0);
    pose(amir,{sit:1,lL:-1.5,lR:-1.5,blink:blink(0),aLx:-1.4,aRx:-1.1,hx:.1});
    din.visible=true; din.position.set(2.6,0,2.7); din.rotation.y=Math.PI+.5+Math.sin(t*3)*.05; pose(din,{eyes:'half',aRx:-1.2+Math.sin(t*6)*.3});
  }
  if(sc==='m3'){ const k=(t-15)/2.6; camAt(lerp(1.6,1.2,k),2.1,lerp(-3.8,-3.2,k),-.2,1.4,1); phone.visible=true; phone.position.set(.32,1.42,.42); phone.rotation.set(-.4,Math.PI,0);
    pose(amir,{sit:1,lL:-1.5,lR:-1.5,eyes:'half',frown:1,brow:'sad',aLx:-1.6,aLz:.6,hz:.25,blink:blink(.4)});
    din.visible=true; din.position.set(-.75,0,1.25); din.rotation.y=Math.PI*.75; pose(din,{eyes:'half',brow:'sad',aLx:-1.3,aLz:.4,hy:.4});
  }
  if(sc==='r1'){ const S=40, k=(t-5.6)/3.4; camAt(S+lerp(1.8,1.2,k),2.3,6.4, S,1.5,0);
    kaviT.visible=phone.visible=true; kaviT.position.set(S,0,0); kaviT.rotation.y=-.3;
    const d=Math.sin(t*7); pose(kaviT,{sway:d*.12,aRx:-2.7,aRz:.4,aLz:-1.2-d*.4,eyes:'n',open:.7,hz:d*.1,lL:d*.2,lR:-d*.2,blink:blink(1)});
    kaviT.userData.hips.position.y += Math.abs(d)*.05;
    phone.position.set(S+.25,2.75,.25); phone.rotation.set(.2,-.3,.2);
    sets.room.userData.cush.forEach((c,i)=>{ c.position.set(-2+i*.7,.9,-2.6); c.rotation.set(0,0,0); });
  }
  if(sc==='r2'){ const S=40; camAt(S+1.2,2.6,5.4, S-1,1.1,-1.6);
    kavi.visible=true; kavi.position.set(S-1.2,0,-1.4); kavi.rotation.y=Math.PI;
    pose(kavi,{lean:-.9,aLx:-2+Math.sin(t*14)*.6,aRx:-2-Math.sin(t*14)*.6});
    sets.room.userData.cush.forEach((c,i)=>{ const tt=t-(11.9+i*.7); if(tt<0){ c.position.set(-2+i*.7,.9,-2.6); c.rotation.set(0,0,0); return; }
      const ph=tt%2.1; c.position.set(-2+i*.7+ph*(i-1)*1.4, .9+ph*4-ph*ph*4.2, -2.6+ph*1.2); if(c.position.y<.1) c.position.y=.1; c.rotation.set(ph*5,ph*3,0); });
  }
  if(sc==='k1'){ const S=80, k=(t-17.6)/3.4; camAt(S+lerp(4,3.5,k),2.3,4, S+.8,1.4,-1.3);
    kavi.visible=cashier.visible=true;
    kavi.position.set(S+1.9,0,-.3); kavi.rotation.y=-.75; cashier.position.set(S+.5,0,-2.3); cashier.rotation.y=.5;
    const l=Math.sin(t*9); pose(kavi,{eyes:l>.6?'':'n',open:.5+.4*Math.abs(l),lean:.05*l,aRx:-1.2,aLx:-.3,aLz:-.8-.4*Math.abs(l)});
    pose(cashier,{open:.4+.4*Math.abs(Math.sin(t*8+1)),eyes:'n',hz:.1*Math.sin(t*3)});
  }
  if(sc==='m4'&&t>=21.6){
    web.visible = t<24.6; web.position.set(-.55,1.95,.65);
    kavi.visible=true;
    const walk=Math.min(1,(t-21.6)/1.2), sitd=t>24.4;
    kavi.position.set(lerp(-3,-.95,walk),0,lerp(1.6,-.3,walk)); kavi.rotation.y=sitd? Math.PI*0.42 : Math.PI*.3;
    const w=Math.sin(t*12)*(walk<1?1:0);
    const kTalk = (t>21.6&&t<23.6)||(t>24.6&&t<26.8)||(t>30.1&&t<32.4);
    pose(kavi, sitd?{sit:1,lL:-1.5,lR:-1.5,eyes:'n',open:kTalk?.4+.5*Math.abs(Math.sin(t*14)):0,aLz:t>29?-.2:-1.1,aRz:t>29?.2:1.1,aRx:t>30?-1.4:0, brow:t>30?'sad':'',blink:blink(2)}
                    :{lL:w*.6,lR:-w*.6,aLx:-w*.5,aRx:w*.5,aRz:1.2,aLz:-.2,open:kTalk?.4+.5*Math.abs(Math.sin(t*14)):0});
    // Amir
    const face = t>33.2; const fk=ease((t-33.2)/.25);
    pose(amir,{sit:1,lL:-1.5,lR:-1.5,eyes:t>27.8&&t<30?'wide':'half',frown:1,brow:t>30?'mad':'',hx:face? lerp(0,1.1,fk):0,lean:face? lerp(0,.6,fk):0,aLx:-1.1,aRx:-1.1,hy:t>21.6&&t<24.4?-.5:0});
    // Din + tray
    if(t>27.6){ din.visible=tray.visible=true; const dk=ease((t-27.6)/.35);
      din.position.set(lerp(3,1.05,dk),0,lerp(-2,-.75,dk)); din.rotation.y=-.9; pose(din,{eyes:'half',aLx:-1.5,aRx:-1.5,open:t>27.9&&t<29.2?.5+.4*Math.abs(Math.sin(t*12)):0});
      tray.position.set(lerp(1.4,-.25,dk),1.1+(1-dk)*.4,-.3); }
    // camera
    if(t<24.4) camAt(1.6,2.3,-4.4, -.5,1.35,.5);
    else if(t<33.2) camAt(.3,2.9,-5.8, 0,1.3,.3);
    else { const k=(t-33.2)/1.3; camAt(lerp(.3,.4,k),lerp(2.9,2.3,k),lerp(-5.8,-3.6,k), 0,1.3,.8); }
    if(t>33.2&&t<33.5) cam.position.x += Math.sin(t*120)*.04;
  }
  if(sc!=='end') R.render(scene,cam);
  // overlays
  show('pov', t<2.6||sc==='m1'&&t<3.1, t<2.6?0:null, t);
  const capTx = t<2.6?'1 jam 47 minit kemudian…': (t>=2.6&&t<3.1)?'8:00 PM': sc==='m4'&&t>=21&&t<21.6?'9:47 PM':'';
  $('cap').textContent=capTx; show('cap', !!capTx, t<2.6?.15:null, t);
  const clk = sc==='hook'||sc==='m4'?'9:47 PM': sc==='m1'?'8:00 PM': sc==='m2'?'8:40 PM': sc==='m3'?'9:15 PM':'';
  $('clock').textContent=clk; show('clock', !!clk && sc!=='end');
  const real = sc==='r1'?'baru siap mandi': sc==='r2'?'cari kunci kereta': sc==='k1'?'beli Twisties. Borak dengan cashier.':'';
  $('realtx').textContent=real; $('real').dataset.rot='rotate(-3deg)'; show('real', !!real, sc==='r1'?5.6:sc==='r2'?11.6:17.6, t);
  const bn=BANS.find(b=>t>=b[0]&&t<b[1]); if(bn) $('bantx').textContent=bn[2]; const be=$('ban'); be.style.display=bn?'flex':'none'; if(bn){ const p=ease((t-bn[0])/.25); be.style.transform=`translateY(${(1-p)*-220}px)`; }
  const bb=BUBS.find(b=>t>=b[0]&&t<b[1]); const bu=$('bub'); if(bb){ bu.textContent=bb[2]; Object.assign(bu.style,{left:bb[3]+'px',top:bb[4]+'px',width:bb[5]+'px'}); bu.style.setProperty('--tx',bb[6]); } show('bub', !!bb, bb?bb[0]:null, t);
  show('end', sc==='end', 34.5, t);
}

/* ---------- PLAYER ---------- */
const wrap=$('wrap'), snd=$('snd');
function fit(){ if(!document.body.classList.contains('render')) stage.style.transform=`scale(${wrap.clientWidth/720})`; }
addEventListener('resize',fit);
let T=0,playing=false,last=0;
function sync(){ try{ snd.currentTime=T; playing?snd.play().catch(()=>{}):snd.pause(); }catch(e){} }
function tick(now){ if(playing){ T=(!snd.paused&&snd.readyState>2)?snd.currentTime:T+(now-last)/1000; if(T>=DUR){T=DUR;playing=false;snd.pause();$('play').textContent='▶';} } last=now; render(T); $('seek').value=T; requestAnimationFrame(tick); }
$('play').onclick=()=>{ if(T>=DUR)T=0; playing=!playing; $('play').textContent=playing?'❚❚':'▶'; sync(); };
$('rew').onclick=()=>{ T=0; playing=true; $('play').textContent='❚❚'; sync(); };
$('seek').oninput=e=>{ T=+e.target.value; sync(); };
if(new URLSearchParams(location.search).has('render')){ document.body.classList.add('render'); window.renderAt=render; render(0); window.ready=true; }
else { fit(); requestAnimationFrame(n=>{last=n;tick(n);}); }
</script>
